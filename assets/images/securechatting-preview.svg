<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B16" />
      <stop offset="50%" stop-color="#0A1424" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="btn-create-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bg-grad)" stroke="rgba(0, 191, 255, 0.25)" stroke-width="1.5" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#00BFFF" stroke-width="0.75">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="120" fill="#00BFFF" opacity="0.08" filter="url(#glow-blur)" />
  <circle cx="650" cy="380" r="140" fill="#8B5CF6" opacity="0.08" filter="url(#glow-blur)" />

  <!-- App Header Bar -->
  <rect x="30" y="24" width="740" height="48" rx="10" fill="#0D1B2D" stroke="rgba(0, 191, 255, 0.2)" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="56" cy="48" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="72" cy="48" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="88" cy="48" r="5" fill="#10B981" opacity="0.8" />

  <!-- Logo & Title -->
  <text x="110" y="53" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#00BFFF">VanishText</text>
  <text x="188" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Private 1-to-1 End-to-End Encrypted Chat</text>

  <!-- Top Right Badges -->
  <rect x="630" y="36" width="124" height="24" rx="12" fill="rgba(0, 191, 255, 0.12)" stroke="rgba(0, 191, 255, 0.3)" stroke-width="1" />
  <circle cx="644" cy="48" r="3.5" fill="#10B981" />
  <text x="654" y="52" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#00BFFF">E2EE ACTIVE</text>

  <!-- Hero Content Within App -->
  <!-- Security Chip -->
  <g transform="translate(260, 95)">
    <rect width="280" height="28" rx="14" fill="rgba(0, 191, 255, 0.1)" stroke="rgba(0, 191, 255, 0.3)" stroke-width="1" />
    <circle cx="18" cy="14" r="4" fill="#00BFFF" />
    <text x="32" y="18" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#00BFFF">Genuine End-to-End Encryption</text>
  </g>

  <!-- Big Headline -->
  <text x="400" y="160" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#F8FAFC" text-anchor="middle">Private conversations.</text>
  <text x="400" y="194" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="url(#neon-cyan)" text-anchor="middle">Zero chat history.</text>
  <text x="400" y="222" font-family="'Inter', sans-serif" font-size="12.5" fill="#94A3B8" text-anchor="middle">Create an encrypted private room or join using a secure invitation code.</text>

  <!-- Two Primary Cards: CREATE ROOM & JOIN ROOM -->
  <!-- Card 1: Create Room -->
  <g transform="translate(140, 245)">
    <rect width="240" height="150" rx="12" fill="#0D1B2D" stroke="rgba(0, 191, 255, 0.3)" stroke-width="1.2" />
    <circle cx="36" cy="38" r="16" fill="rgba(0, 191, 255, 0.15)" />
    <!-- Plus Icon -->
    <path d="M36 30 v16 M28 38 h16" stroke="#00BFFF" stroke-width="2.5" stroke-linecap="round" />
    <text x="64" y="43" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">CREATE ROOM</text>
    <text x="24" y="75" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Generate an unpredictable CSPRNG</text>
    <text x="24" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">invitation code and invite a guest.</text>
    
    <!-- Button -->
    <rect x="24" y="108" width="192" height="28" rx="6" fill="url(#btn-create-grad)" />
    <text x="120" y="126" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">CREATE ROOM →</text>
  </g>

  <!-- Card 2: Join Room -->
  <g transform="translate(420, 245)">
    <rect width="240" height="150" rx="12" fill="#0D1B2D" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.2" />
    <circle cx="36" cy="38" r="16" fill="rgba(139, 92, 246, 0.15)" />
    <!-- Join Arrow Icon -->
    <path d="M30 38 h12 M38 33 l5 5 -5 5" stroke="#A78BFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="64" y="43" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">JOIN ROOM</text>
    <text x="24" y="75" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Have an invitation code? Join a secure</text>
    <text x="24" y="92" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">1-to-1 conversation instantly.</text>
    
    <!-- Button -->
    <rect x="24" y="108" width="192" height="28" rx="6" fill="#1E293B" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1" />
    <text x="120" y="126" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#CBD5E1" text-anchor="middle">JOIN ROOM →</text>
  </g>

  <!-- Pillars Row -->
  <g transform="translate(180, 420)">
    <rect width="130" height="34" rx="8" fill="#0A1424" stroke="rgba(0, 191, 255, 0.15)" stroke-width="1" />
    <text x="65" y="442" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">⚡ 15m Auto-Delete</text>

    <rect x="155" width="130" height="34" rx="8" fill="#0A1424" stroke="rgba(0, 191, 255, 0.15)" stroke-width="1" />
    <text x="220" y="442" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">⏱️ 1-Hr Room Life</text>

    <rect x="310" width="130" height="34" rx="8" fill="#0A1424" stroke="rgba(0, 191, 255, 0.15)" stroke-width="1" />
    <text x="375" y="442" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">🛡️ Zero Storage</text>
  </g>
</svg>
